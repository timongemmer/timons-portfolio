<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon - Timon Gemmer</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            /* Ändert die Ausrichtung, damit Elemente untereinander stehen */
            flex-direction: column; 
            justify-content: center;
            align-items: center;
            background-color: #ffffff; 
            /* Eine moderne, schlichte Schriftart für den Button */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        img {
            max-width: 90%;
            /* Etwas Platz nach unten gelassen für den Button */
            max-height: 70vh; 
            height: auto;
            object-fit: contain;
            /* Abstand zwischen Bild und Button */
            margin-bottom: 40px; 
        }

        /* Das Design des Buttons */
        .mail-button {
            background-color: #000000; /* Schwarz, passend zur Schrift im Bild */
            color: #ffffff;
            text-decoration: none; /* Entfernt den Unterstrich des Links */
            padding: 14px 28px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            /* Eine weiche Animation, wenn man mit der Maus darüber fährt */
            transition: transform 0.2s ease, background-color 0.2s ease;
        }

        /* Hover-Effekt für den PC */
        .mail-button:hover {
            background-color: #333333;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <!-- Das Bild -->
    <img src="teaser.jpg" alt="You're too early">
    
    <!-- Der Testbutton mit der Mailto-Funktion -->
    <a href="mailto:hello@timongemmer.com?subject=hello%20world&body=hello%20world" class="mail-button">
        Sag "Hello World"
    </a>
</body>
</html>
